name: Update Push Log

on:
  push:
    branches:
      - main
    paths-ignore:
      - PUSH_LOG.md

permissions:
  contents: write

jobs:
  update-push-log:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append push summary
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi

          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          TMP_COMMITS="$(mktemp)"
          git log --no-merges --pretty='%h%x09%s' ${RANGE} > "$TMP_COMMITS" || true

          print_section() {
            local title="$1"
            local pattern="$2"
            echo "### ${title}"
            local lines
            lines="$(grep -Ei "$pattern" "$TMP_COMMITS" || true)"
            if [ -n "$lines" ]; then
              echo "$lines" | sed -E 's/^([^[:space:]]+)\t(.*)$/- \1 \2/'
            else
              echo "- Aucun"
            fi
            echo ""
          }

          {
            echo ""
            echo "## Push ${AFTER}"
            echo ""
            echo "- Date: ${DATE_UTC}"
            echo "- Auteur: ${{ github.actor }}"
            echo "- Range: ${RANGE}"
            echo ""
            print_section "Ajouts" '(^|:|[[:space:]])(feat|add|ajout|create|new)(\(|:|[[:space:]]|$)'
            print_section "Corrections" '(^|:|[[:space:]])(fix|bug|hotfix|correct|corrige)(\(|:|[[:space:]]|$)'
            print_section "Refactor" '(^|:|[[:space:]])(refactor|cleanup|clean)(\(|:|[[:space:]]|$)'
            print_section "Documentation" '(^|:|[[:space:]])(docs|doc|readme)(\(|:|[[:space:]]|$)'
            echo "### Autres"
            OTHERS="$(grep -Eiv '(^|:|[[:space:]])(feat|add|ajout|create|new|fix|bug|hotfix|correct|corrige|refactor|cleanup|clean|docs|doc|readme)(\(|:|[[:space:]]|$)' "$TMP_COMMITS" || true)"
            if [ -n "$OTHERS" ]; then
              echo "$OTHERS" | sed -E 's/^([^[:space:]]+)\t(.*)$/- \1 \2/'
            else
              echo "- Aucun"
            fi
            echo ""
          } >> PUSH_LOG.md

          rm -f "$TMP_COMMITS"

      - name: Commit and push log update
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- PUSH_LOG.md; then
            echo "No log changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PUSH_LOG.md
          git commit -m "chore(pushlog): update push log for ${{ github.sha }}"
          git push
